[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-vault-graph"
version = "0.1.0"
description = "A local CLI for Obsidian knowledge graphs, backlinks, centrality, hygiene, and QMD hybrid retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kartik Kabadi" }]
keywords = ["obsidian", "knowledge-graph", "markdown", "qmd", "pkm", "backlinks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = []

[project.optional-dependencies]
qmd = []
dev = ["pytest>=8"]

[project.scripts]
vault-graph = "obsidian_vault_graph.cli:main"

[project.urls]
Homepage = "https://github.com/kartikkabadi/obsidian-vault-graph"
Repository = "https://github.com/kartikkabadi/obsidian-vault-graph"
Issues = "https://github.com/kartikkabadi/obsidian-vault-graph/issues"

[tool.setuptools.packages.find]
include = ["obsidian_vault_graph*"]
